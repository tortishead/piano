name: Refresh listings

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape bechstein.com
        run: python3 scrape.py

      - name: Rebuild the page
        run: python3 build_page.py --pages

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all_urls.txt instruments.json docs/index.html docs/data.json
          if git diff --cached --quiet; then
            echo "No listing changes."
          else
            git commit -m "Refresh listings ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
